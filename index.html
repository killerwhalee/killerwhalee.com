<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>killerwhalee</title>
<meta name="description" content="작고 조용한 iPhone 앱을 만듭니다.">
<link rel="icon" href="matda/icon.png">
<style>
  :root {
    --bg: #EEEEEF; --surface: #FFFFFF; --text: #101319; --muted: #4A4F5A; --line: #D4D5D6;
    --accent: #F5BE3B; --accent-ink: #1E1A10; --link: #8A5F0F; --rule: rgba(16,19,25,.06);
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0D0F14; --surface: #1B202A; --text: #D8DADF; --muted: #868C97; --line: #2A303C; --link: #F5BE3B; --rule: rgba(255,255,255,.05); color-scheme: dark; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.7 -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", system-ui, sans-serif; -webkit-font-smoothing: antialiased;
    background-image: linear-gradient(to bottom, var(--rule) 0 1px, transparent 1px); background-size: 100% 32px; }
  main { max-width: 680px; margin: 0 auto; padding: 56px 20px 72px; }
  h1 { font-size: 30px; line-height: 1.3; margin: 0; letter-spacing: -0.01em; }
  .lede { margin: 6px 0 0; color: var(--muted); }
  h2 { font-size: 13px; letter-spacing: .08em; color: var(--muted); margin: 44px 0 12px; font-weight: 600; }
  .app { display: grid; grid-template-columns: 64px 1fr; gap: 16px; align-items: center; background: var(--surface); border-radius: 18px; padding: 18px 20px; }
  .app img { width: 64px; height: 64px; border-radius: 15px; }
  .app h3 { margin: 0; font-size: 19px; }
  .app p { margin: 2px 0 8px; color: var(--muted); font-size: 15px; }
  .app nav { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 14px; }
  .soon { font-size: 12px; padding: 2px 8px; border-radius: 99px; background: var(--accent); color: var(--accent-ink); font-weight: 600; margin-left: 6px; vertical-align: 2px; }
  a { color: var(--link); }
  footer { margin-top: 48px; padding-top: 16px; border-top: 1px solid var(--line); font-size: 14px; color: var(--muted); }
</style>
</head>
<body>
<main>
  <h1>killerwhalee</h1>
  <p class="lede">필요한 것만 남긴, 작고 조용한 iPhone 앱을 만들어요.</p>

  <h2>앱</h2>
  <article class="app">
    <img src="matda/icon.png" alt="마따 앱 아이콘">
    <div>
      <h3>마따 <span class="soon">곧 출시</span></h3>
      <p>빠르게 남기고 빠르게 지우는 메모</p>
      <nav><a href="matda/support.html">지원</a><a href="matda/privacy.html">개인정보 처리방침</a></nav>
    </div>
  </article>

  <footer>문의 <a href="mailto:support@killerwhalee.com">support@killerwhalee.com</a></footer>
</main>
</body>
</html>
